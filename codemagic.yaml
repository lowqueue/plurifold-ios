workflows:
  plurifold-simulator:
    name: Plurifold - first simulator build
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Build Plurifold for iOS Simulator
        script: |
          set -euo pipefail
          xcodebuild build \
            -project Plurifold.xcodeproj \
            -scheme Plurifold \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
      - name: Package the simulator app
        script: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/Plurifold.app \
            Plurifold-simulator.zip
    artifacts:
      - Plurifold-simulator.zip
      - build.log
