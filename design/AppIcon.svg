<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" style="color: #111111">
  <title id="title">Plurifold</title>
  <desc id="desc">A geometric lowercase p followed closely by a blinking block cursor. The letter stays still.</desc>
  <style>
    .cursor { animation: plurifold-blink 1.2s step-end infinite; }
    @keyframes plurifold-blink {
      0%, 64.99% { opacity: 1; }
      65%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; opacity: 1; }
    }
  </style>
  <g fill="currentColor" transform="translate(-13 -2)">
    <path fill-rule="evenodd" d="M104 146H148V162C163 149 182 142 204 142C254 142 290 178 290 228C290 278 254 314 204 314C182 314 164 308 148 295V374H104Z M148 228C148 256 168 274 197 274C225 274 246 255 246 228C246 201 225 182 197 182C168 182 148 200 148 228Z"/>
    <rect class="cursor" x="312" y="140" width="122" height="234"/>
  </g>
</svg>
